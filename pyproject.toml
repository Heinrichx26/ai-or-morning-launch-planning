[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-or-morning-launch-planning"
version = "0.1.0"
description = "Reproducibility code for AI-OR morning launch planning experiments."
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pytest",
  "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
